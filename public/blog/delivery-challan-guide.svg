<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <text x="40" y="140" font-size="44" font-weight="800" fill="#f1f5f9">Delivery Challan Guide</text>
  <text x="40" y="200" font-size="26" fill="#94a3b8">Format, When to Use &amp; GST Rules</text>
  <rect x="40" y="240" width="560" height="320" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">DELIVERY CHALLAN</text>
  <g font-size="13" fill="#64748b" transform="translate(60,310)">
    <text y="0">DC Number &amp; Date</text><text y="35">Consignor GSTIN &amp; Address</text>
    <text y="70">Consignee Name &amp; Address</text><text y="105">Item Description + HSN</text>
    <text y="140">Quantity &amp; Unit of Measure</text><text y="175">Value (for reference only)</text>
    <text y="210">Reason: Job Work / Sale Return / Others</text>
  </g>
  <rect x="640" y="60" width="520" height="510" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="900" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">When to Use a Delivery Challan</text>
  <g font-size="13" fill="#94a3b8" transform="translate(660,145)">
    <text y="0" fill="#4ade80">✓ Job work — goods sent for processing</text>
    <text y="35" fill="#4ade80">✓ Goods sent on approval / trial basis</text>
    <text y="70" fill="#4ade80">✓ Liquid gas / oil supply (measured on delivery)</text>
    <text y="105" fill="#4ade80">✓ Sales return or purchase return movement</text>
    <text y="140" fill="#4ade80">✓ Exhibition goods or demo samples</text>
    <text y="185" fill="#f87171">✗ Cannot replace a tax invoice for taxable sale</text>
    <text y="220" fill="#f87171">✗ Cannot be used to claim Input Tax Credit</text>
    <text y="275" fill="#818cf8" font-weight="600">Must accompany e-Way Bill if value &gt; ₹50,000</text>
  </g>
</svg>
