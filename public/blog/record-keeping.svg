<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5"/></pattern></defs>
  <rect width="1200" height="630" fill="url(#g)" opacity="0.07"/>
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
  <text x="140" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1">BUSINESS RECORDS</text>
  <text x="40" y="145" font-size="38" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Record Keeping for SMEs</text>
  <text x="40" y="200" font-size="24" fill="#94a3b8">What to Keep, For How Long &amp; GST Requirements</text>
  <!-- Retention table -->
  <rect x="40" y="240" width="570" height="340" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="325" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">Document Retention Periods</text>
  <g font-size="12">
    <rect x="55" y="295" width="540" height="30" rx="6" fill="#0f172a"/>
    <text x="70" y="315" fill="#818cf8" font-weight="600">GST Records (invoices, returns, books)</text>
    <text x="540" y="315" text-anchor="end" fill="#4ade80" font-weight="700">72 months</text>
    <text x="70" y="355" fill="#94a3b8">Income Tax (books of accounts)</text>
    <text x="540" y="355" text-anchor="end" fill="#fbbf24" font-weight="600">6 years</text>
    <text x="70" y="390" fill="#94a3b8">TDS certificates (Form 16A)</text>
    <text x="540" y="390" text-anchor="end" fill="#fbbf24" font-weight="600">7 years</text>
    <text x="70" y="425" fill="#94a3b8">Contracts &amp; agreements</text>
    <text x="540" y="425" text-anchor="end" fill="#fbbf24" font-weight="600">3 years</text>
    <text x="70" y="460" fill="#94a3b8">MSME registration &amp; certificates</text>
    <text x="540" y="460" text-anchor="end" fill="#67e8f9" font-weight="600">Indefinitely</text>
    <text x="70" y="495" fill="#94a3b8">Bank statements</text>
    <text x="540" y="495" text-anchor="end" fill="#fbbf24" font-weight="600">10 years</text>
    <text x="70" y="540" fill="#64748b" font-size="11">Source: CGST Rules, Income Tax Act 1961 · Last verified Sep 2026</text>
  </g>
  <!-- Right panel -->
  <rect x="640" y="60" width="520" height="520" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="900" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5f9">Digital Record-Keeping Tips</text>
  <g font-size="13" fill="#94a3b8" transform="translate(660,140)">
    <text y="0" fill="#4ade80" font-weight="600">✓ Scan &amp; cloud backup every invoice</text>
    <text y="35">✓ Keep GST portal login credentials safe</text>
    <text y="70">✓ Download Form 26AS every quarter</text>
    <text y="105">✓ Folder structure: Year → Month → Doc type</text>
    <text y="140" fill="#f87171" font-weight="600">✗ Do not delete invoices before 72 months</text>
    <text y="175">✗ Do not rely on WhatsApp for records</text>
    <text y="210">✗ Do not mix personal and business expenses</text>
    <text y="260" fill="#818cf8" font-weight="600">GST Rule 56 requirements:</text>
    <text y="290">Accounts at principal place of business</text>
    <text y="320">Electronic records must be backed up</text>
    <text y="350">Accessible to GST officer on demand</text>
  </g>
</svg>
