<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5"/></pattern></defs>
  <rect width="1200" height="630" fill="url(#g)" opacity="0.07"/>
  <rect x="40" y="40" width="220" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
  <text x="150" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1">PAYMENT RECOVERY</text>
  <text x="40" y="145" font-size="40" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Recover Late Payments</text>
  <text x="40" y="200" font-size="24" fill="#94a3b8">Escalation Strategy for Indian Small Businesses</text>
  <!-- Timeline -->
  <g transform="translate(40,250)">
    <line x1="30" y1="20" x2="30" y2="280" stroke="#334155" stroke-width="2"/>
    <g transform="translate(0,0)">
      <circle cx="30" cy="20" r="12" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-width="1.5"/>
      <text x="30" y="25" text-anchor="middle" font-size="11" fill="#4ade80" font-weight="700">1</text>
      <text x="55" y="15" font-size="14" fill="#f1f5f9" font-weight="600">Invoice Due — Friendly reminder</text>
      <text x="55" y="35" font-size="12" fill="#64748b">Email: "Just checking in on INV-001"</text>
    </g>
    <g transform="translate(0,80)">
      <circle cx="30" cy="20" r="12" fill="#f59e0b" opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="30" y="25" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="700">2</text>
      <text x="55" y="15" font-size="14" fill="#f1f5f9" font-weight="600">+7 days — Formal follow-up</text>
      <text x="55" y="35" font-size="12" fill="#64748b">Mention interest clause in T&amp;Cs</text>
    </g>
    <g transform="translate(0,160)">
      <circle cx="30" cy="20" r="12" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
      <text x="30" y="25" text-anchor="middle" font-size="11" fill="#f87171" font-weight="700">3</text>
      <text x="55" y="15" font-size="14" fill="#f1f5f9" font-weight="600">+15 days — Legal notice</text>
      <text x="55" y="35" font-size="12" fill="#64748b">MSME Act Section 16 — 3x bank rate interest</text>
    </g>
    <g transform="translate(0,240)">
      <circle cx="30" cy="20" r="12" fill="#6366f1" opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
      <text x="30" y="25" text-anchor="middle" font-size="11" fill="#818cf8" font-weight="700">4</text>
      <text x="55" y="15" font-size="14" fill="#f1f5f9" font-weight="600">+30 days — MSME Samadhaan / NCLT</text>
      <text x="55" y="35" font-size="12" fill="#64748b">File claim if buyer is a larger enterprise</text>
    </g>
  </g>
  <!-- MSME panel -->
  <rect x="700" y="60" width="460" height="520" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="930" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5f9">MSME Protections</text>
  <g font-size="13" fill="#94a3b8" transform="translate(720,140)">
    <text y="0" fill="#4ade80" font-weight="600">MSME Act 2006 — Section 15-16</text>
    <text y="35">Payment must be made within 45 days</text>
    <text y="65">if agreed in writing (15 days default)</text>
    <text y="110" fill="#fbbf24" font-weight="600">Interest on delayed payment:</text>
    <text y="140">3x the bank rate notified by RBI</text>
    <text y="170">(Compounded monthly)</text>
    <text y="215" fill="#f472b6" font-weight="600">MSME Samadhaan portal:</text>
    <text y="245">File online at samadhaan.msme.gov.in</text>
    <text y="275">Facilitation Council reviews in 90 days</text>
  </g>
</svg>
