<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <text x="40" y="140" font-size="38" font-weight="800" fill="#f1f5f9">Quotation to Cash Workflow</text>
  <text x="40" y="200" font-size="22" fill="#94a3b8">From First Quote to Final Payment — The Complete Sales Cycle</text>
  <g transform="translate(40,240)">
    <rect width="140" height="55" rx="10" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1.5"/>
    <text x="70" y="32" text-anchor="middle" font-size="12" fill="#818cf8" font-weight="600">1. Quotation</text>
    <text x="150" y="32" fill="#334155" font-size="20">→</text>
    <rect x="174" width="140" height="55" rx="10" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="244" y="32" text-anchor="middle" font-size="12" fill="#a78bfa" font-weight="600">2. Accepted</text>
    <text x="324" y="32" fill="#334155" font-size="20">→</text>
    <rect x="348" width="140" height="55" rx="10" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="418" y="32" text-anchor="middle" font-size="12" fill="#67e8f9" font-weight="600">3. Delivery</text>
    <text x="498" y="32" fill="#334155" font-size="20">→</text>
    <rect x="522" width="140" height="55" rx="10" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="592" y="32" text-anchor="middle" font-size="12" fill="#fbbf24" font-weight="600">4. Invoice</text>
    <text x="672" y="32" fill="#334155" font-size="20">→</text>
    <rect x="696" width="140" height="55" rx="10" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
    <text x="766" y="32" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="600">5. Payment</text>
    <text x="836" y="32" fill="#334155" font-size="20">→</text>
    <rect x="860" width="140" height="55" rx="10" fill="#ec4899" opacity="0.2" stroke="#ec4899" stroke-width="1.5"/>
    <text x="930" y="32" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="600">6. Receipt</text>
  </g>
  <rect x="40" y="350" width="1120" height="220" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">Common Drop-off Points &amp; How to Fix Them</text>
  <g font-size="13" fill="#94a3b8" transform="translate(60,410)">
    <text y="0" fill="#f87171" font-weight="600">Quotation not accepted →</text><text y="0" x="300">Follow up within 3 business days</text>
    <text y="40" fill="#f87171" font-weight="600">Invoice ignored →</text><text y="40" x="300">Remind on Day 3, Day 7, then formal notice</text>
    <text y="80" fill="#f87171" font-weight="600">Payment delayed →</text><text y="80" x="300">Charge interest per your T&amp;Cs; MSME Samadhaan if registered</text>
    <text y="120" fill="#f87171" font-weight="600">No receipt issued →</text><text y="120" x="300">Always send acknowledgment; protects both parties</text>
  </g>
</svg>
