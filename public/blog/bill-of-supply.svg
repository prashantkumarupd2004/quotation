<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5"/></pattern></defs>
  <rect width="1200" height="630" fill="url(#g)" opacity="0.07"/>
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
  <text x="140" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1">GST BILLING</text>
  <text x="40" y="145" font-size="42" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Bill of Supply vs Tax Invoice</text>
  <text x="40" y="200" font-size="24" fill="#94a3b8">Which document must your business issue under GST?</text>
  <!-- Two-column comparison -->
  <rect x="40" y="240" width="520" height="330" rx="20" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="580" y="240" width="580" height="330" rx="20" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#818cf8">Tax Invoice</text>
  <text x="870" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#4ade80">Bill of Supply</text>
  <line x1="60" y1="300" x2="540" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="600" y1="300" x2="1140" y2="300" stroke="#334155" stroke-width="1"/>
  <g font-size="13" fill="#94a3b8">
    <text x="60" y="330">Issued by Regular GST taxpayer</text>
    <text x="60" y="360">For taxable supply of goods/services</text>
    <text x="60" y="390">Shows CGST + SGST or IGST</text>
    <text x="60" y="420">Buyer can claim Input Tax Credit</text>
    <text x="60" y="450">Mandatory fields: 16 under Rule 46</text>
    <text x="60" y="480">Minimum value: No threshold</text>
    <text x="600" y="330">Issued by Composition Dealer</text>
    <text x="600" y="360">For exempt / nil-rated / non-GST supply</text>
    <text x="600" y="390">Shows NO GST amount</text>
    <text x="600" y="420">Buyer cannot claim ITC</text>
    <text x="600" y="450">Must print: "Composition taxable person"</text>
    <text x="600" y="480">Composition: turnover under ₹1.5 Cr</text>
  </g>
  <!-- Warning -->
  <rect x="40" y="590" width="560" height="30" rx="10" fill="#ef4444" opacity="0.15"/>
  <text x="320" y="610" text-anchor="middle" font-size="12" fill="#f87171">⚠ Composition dealer issuing Tax Invoice → liable under Sec 76</text>
</svg>
