<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="40" y="60" width="64" height="8" rx="4" fill="#f59e0b"/>
  <text x="40" y="140" font-size="44" font-weight="800" fill="#f1f5f9">Digital Signature on</text>
  <text x="40" y="192" font-size="44" font-weight="800" fill="#f1f5f9">Quotations &amp; Invoices</text>
  <text x="40" y="244" font-size="22" fill="#94a3b8">DSC vs scanned signature · Class 3 · Aadhaar eSign</text>

  <!-- document -->
  <g transform="translate(640,180)">
    <rect width="380" height="320" rx="14" fill="#f8fafc"/>
    <rect x="30" y="30" width="180" height="14" rx="7" fill="#0f172a"/>
    <g fill="#cbd5e1">
      <rect x="30" y="70" width="320" height="10" rx="5"/>
      <rect x="30" y="95" width="320" height="10" rx="5"/>
      <rect x="30" y="120" width="240" height="10" rx="5"/>
      <rect x="30" y="160" width="320" height="10" rx="5"/>
      <rect x="30" y="185" width="200" height="10" rx="5"/>
    </g>
    <!-- signature squiggle -->
    <path d="M 40 260 C 90 220, 120 280, 170 240 S 260 260, 300 235" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="292" font-size="14" fill="#64748b">Authorised Signatory</text>
    <!-- seal -->
    <circle cx="305" cy="275" r="34" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <text x="305" y="282" font-size="18" font-weight="800" fill="#b45309" text-anchor="middle">DSC</text>
  </g>

  <!-- USB token -->
  <g transform="translate(60,340)">
    <rect width="200" height="90" rx="14" fill="#1e293b"/>
    <rect x="200" y="28" width="60" height="34" rx="6" fill="#f59e0b"/>
    <circle cx="60" cy="45" r="16" fill="#0f172a"/>
    <circle cx="60" cy="45" r="7" fill="#f59e0b"/>
    <text x="100" y="52" font-size="20" font-weight="700" fill="#e2e8f0">USB TOKEN</text>
  </g>
</svg>
