<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="40" y="60" width="64" height="8" rx="4" fill="#38bdf8"/>
  <text x="40" y="140" font-size="44" font-weight="800" fill="#f1f5f9">Printing Press</text>
  <text x="40" y="192" font-size="44" font-weight="800" fill="#f1f5f9">Quotation Format</text>
  <text x="40" y="244" font-size="22" fill="#94a3b8">Paper GSM, quantity slabs &amp; per-piece rates</text>
  <g transform="translate(720,160)">
    <g>
      <rect x="0" y="30" width="110" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" transform="rotate(-8 55 105)"/>
      <rect x="25" y="45" width="110" height="150" rx="6" fill="#243449" stroke="#38bdf8" stroke-width="2"/>
      <rect x="50" y="60" width="110" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" transform="rotate(6 105 135)"/>
      <text x="80" y="130" font-size="17" font-weight="700" fill="#7dd3fc">300 GSM</text>
      <text x="80" y="155" font-size="15" fill="#94a3b8">4-colour</text>
    </g>
    <g font-size="19" transform="translate(220,40)">
      <text x="0" y="0" fill="#64748b">1,000 pcs</text>
      <text x="170" y="0" text-anchor="end" fill="#7dd3fc" font-weight="700">₹6.20/pc</text>
      <text x="0" y="42" fill="#64748b">5,000 pcs</text>
      <text x="170" y="42" text-anchor="end" fill="#7dd3fc" font-weight="700">₹3.80/pc</text>
      <text x="0" y="84" fill="#64748b">10,000 pcs</text>
      <text x="170" y="84" text-anchor="end" fill="#7dd3fc" font-weight="700">₹2.90/pc</text>
      <line x1="0" y1="110" x2="170" y2="110" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="145" fill="#94a3b8" font-size="17">Design charges extra</text>
    </g>
  </g>
  <text x="40" y="590" font-size="16" fill="#475569">QuotationMaker.in</text>
