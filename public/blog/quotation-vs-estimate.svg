<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <text x="40" y="140" font-size="42" font-weight="800" fill="#f1f5f9">Quotation vs Estimate</text>
  <text x="40" y="200" font-size="24" fill="#94a3b8">Key Differences Every Indian Business Must Know</text>
  <rect x="40" y="240" width="510" height="330" rx="20" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="295" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#818cf8">QUOTATION</text>
  <g font-size="13" fill="#94a3b8" transform="translate(60,305)">
    <text y="0">Fixed, binding price offer</text>
    <text y="35">Valid for a stated period (e.g. 30 days)</text>
    <text y="70">Accepted in writing = enforceable contract</text>
    <text y="105">Use when: scope is fully defined</text>
    <text y="140">Common in: construction, IT, services</text>
    <text y="180" fill="#4ade80">✓ Protects you from scope creep</text>
    <text y="215" fill="#4ade80">✓ Client knows exactly what they will pay</text>
  </g>
  <rect x="570" y="240" width="590" height="330" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="865" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#fbbf24">ESTIMATE</text>
  <g font-size="13" fill="#94a3b8" transform="translate(590,305)">
    <text y="0">Approximate cost — not binding</text>
    <text y="35">Final cost may vary (+/- 10-20%)</text>
    <text y="70">Accepted does not fix the price</text>
    <text y="105">Use when: scope may change</text>
    <text y="140">Common in: repairs, civil work, R&amp;D</text>
    <text y="180" fill="#fbbf24">⚠ Can lead to disputes if overrun is large</text>
    <text y="215" fill="#fbbf24">⚠ Mention estimate tolerance in writing</text>
  </g>
</svg>
