<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="40" y="60" width="64" height="8" rx="4" fill="#f59e0b"/>
  <text x="40" y="140" font-size="44" font-weight="800" fill="#f1f5f9">E-Way Bill in India</text>
  <text x="40" y="192" font-size="44" font-weight="800" fill="#f1f5f9">When You Need One</text>
  <text x="40" y="244" font-size="22" fill="#94a3b8">₹50,000 limit · how to generate · validity by distance</text>

  <!-- road -->
  <rect x="560" y="440" width="600" height="90" rx="10" fill="#1e293b"/>
  <g fill="#475569">
    <rect x="590" y="478" width="60" height="10" rx="5"/>
    <rect x="690" y="478" width="60" height="10" rx="5"/>
    <rect x="790" y="478" width="60" height="10" rx="5"/>
    <rect x="890" y="478" width="60" height="10" rx="5"/>
    <rect x="990" y="478" width="60" height="10" rx="5"/>
    <rect x="1090" y="478" width="40" height="10" rx="5"/>
  </g>

  <!-- truck -->
  <g transform="translate(660,300)">
    <rect x="0" y="60" width="200" height="90" rx="10" fill="#f59e0b"/>
    <rect x="14" y="74" width="60" height="8" rx="4" fill="#92400e" opacity="0.55"/>
    <rect x="14" y="90" width="140" height="8" rx="4" fill="#92400e" opacity="0.4"/>
    <rect x="200" y="84" width="110" height="66" rx="10" fill="#e2e8f0"/>
    <rect x="216" y="94" width="56" height="34" rx="6" fill="#0f172a"/>
    <circle cx="70" cy="162" r="26" fill="#334155"/>
    <circle cx="70" cy="162" r="11" fill="#94a3b8"/>
    <circle cx="250" cy="162" r="26" fill="#334155"/>
    <circle cx="250" cy="162" r="11" fill="#94a3b8"/>
  </g>

  <!-- e-way bill document card -->
  <g transform="translate(180,330)">
    <rect x="0" y="0" width="220" height="250" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="24" y="26" width="120" height="14" rx="7" fill="#10b981"/>
    <rect x="24" y="58" width="172" height="10" rx="5" fill="#334155"/>
    <rect x="24" y="80" width="140" height="10" rx="5" fill="#334155"/>
    <rect x="24" y="102" width="160" height="10" rx="5" fill="#334155"/>
    <rect x="24" y="124" width="110" height="10" rx="5" fill="#334155"/>
    <text x="110" y="190" text-anchor="middle" font-size="34" font-weight="800" fill="#34d399">₹50,000</text>
    <text x="110" y="218" text-anchor="middle" font-size="15" fill="#94a3b8">consignment limit</text>
  </g>

  <!-- route pin -->
  <g transform="translate(1020,180)">
    <path d="M0,-60 C-34,-60 -55,-34 -55,-6 C-55,26 0,70 0,70 C0,70 55,26 55,-6 C55,-34 34,-60 0,-60 Z" fill="#f59e0b"/>
    <circle cx="0" cy="-8" r="20" fill="#0f172a"/>
    <text x="0" y="2" text-anchor="middle" font-size="22" font-weight="800" fill="#f59e0b">A→B</text>
  </g>

  <!-- Part A / Part B chips -->
  <g font-size="18" font-weight="700">
    <rect x="430" y="380" width="120" height="44" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="490" y="409" text-anchor="middle" fill="#fbbf24">Part A</text>
    <rect x="430" y="436" width="120" height="44" rx="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="490" y="465" text-anchor="middle" fill="#34d399">Part B</text>
  </g>
</svg>
