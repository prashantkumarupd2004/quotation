<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0f172a"/>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5"/></pattern></defs>
  <rect width="1200" height="630" fill="url(#g)" opacity="0.07"/>
  <rect x="40" y="40" width="160" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
  <text x="120" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1">E-WAY BILL</text>
  <text x="40" y="145" font-size="44" font-weight="800" fill="#f1f5f9" letter-spacing="-1">E-Way Bill Rules 2026</text>
  <text x="40" y="200" font-size="26" fill="#94a3b8">Threshold, Validity &amp; Part A / Part B Explained</text>
  <!-- Threshold card -->
  <rect x="40" y="250" width="280" height="130" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="180" y="295" text-anchor="middle" font-size="13" fill="#818cf8" font-weight="700">THRESHOLD</text>
  <text x="180" y="345" text-anchor="middle" font-size="38" font-weight="800" fill="#f1f5f9">₹50,000</text>
  <text x="180" y="370" text-anchor="middle" font-size="12" fill="#64748b">per consignment / transaction</text>
  <!-- Validity card -->
  <rect x="340" y="250" width="280" height="130" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="295" text-anchor="middle" font-size="13" fill="#a78bfa" font-weight="700">VALIDITY</text>
  <text x="480" y="345" text-anchor="middle" font-size="26" font-weight="800" fill="#f1f5f9">1 day / 200 km</text>
  <text x="480" y="370" text-anchor="middle" font-size="12" fill="#64748b">up to 200 km per day</text>
  <!-- Part breakdown -->
  <rect x="640" y="60" width="520" height="530" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="900" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5f9">E-Way Bill Structure</text>
  <rect x="660" y="140" width="480" height="180" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="900" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#818cf8">PART A — Supplier Fills</text>
  <text x="680" y="205" font-size="12" fill="#64748b">GSTIN of Supplier &amp; Recipient</text>
  <text x="680" y="227" font-size="12" fill="#64748b">Place of Supply (State Code)</text>
  <text x="680" y="249" font-size="12" fill="#64748b">HSN Code, Description &amp; Value</text>
  <text x="680" y="271" font-size="12" fill="#64748b">Reason for Transportation</text>
  <text x="680" y="293" font-size="12" fill="#64748b">Document Number &amp; Date</text>
  <rect x="660" y="340" width="480" height="160" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="900" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">PART B — Transporter Fills</text>
  <text x="680" y="405" font-size="12" fill="#64748b">Vehicle Number or Transporter ID</text>
  <text x="680" y="427" font-size="12" fill="#64748b">Mode: Road / Rail / Air / Ship</text>
  <text x="680" y="449" font-size="12" fill="#64748b">Required to move goods &gt; 10 km</text>
  <!-- Footer -->
  <rect x="660" y="520" width="480" height="50" rx="10" fill="#1e293b"/>
  <text x="900" y="550" text-anchor="middle" font-size="12" fill="#64748b">Last verified: September 2026 · Source: CGST Rules</text>
  <!-- Bottom tags -->
  <g transform="translate(40, 420)">
    <rect width="140" height="32" rx="16" fill="#22c55e" opacity="0.2"/>
    <text x="70" y="21" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="600">₹50k+ moves</text>
    <rect x="156" width="160" height="32" rx="16" fill="#f59e0b" opacity="0.2"/>
    <text x="236" y="21" text-anchor="middle" font-size="12" fill="#fbbf24" font-weight="600">Interstate always</text>
    <rect x="332" width="160" height="32" rx="16" fill="#ef4444" opacity="0.2"/>
    <text x="412" y="21" text-anchor="middle" font-size="12" fill="#f87171" font-weight="600">Penalty: ₹10,000+</text>
  </g>
</svg>
